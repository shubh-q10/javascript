<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit and Remove elements in DOM</title>
  </head>
  <body style="background-color: #212121; color: white">

    <ul class="language">
        <li>javascript</li>
    </ul>
  </body>
  <script>
    function addlanguage(langName) {

        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addlanguage("python")
    addlanguage("typescript")

    // this time we will add language in an optimized way

    function addOptiLanguage(langName) {

        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
        
    }

    addOptiLanguage("ruby")
    addOptiLanguage("cpp")

    //Edit

    const secondlang = document.querySelector('li:nth-child(2)')
    const newli = document.createElement('li')
    newli.textContent = "mojo"
    secondlang.replaceWith(newli)

    //edit: replace javascript with Typescript

    const firstlang = document.querySelector('li:nth-child(1)')
    firstlang.outerHTML = '<li>TypeScript</li>'

    //remove: remove cpp

    const lastlang = document.querySelector("li:last-child")
    lastlang.remove()

    


  </script>
</html>
