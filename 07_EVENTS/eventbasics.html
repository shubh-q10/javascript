<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Events</title>
  </head>
  <body style="background-color: #414141; color: aliceblue">
    <h2>Amazing image</h2>
    <div>
      <ul id="images">
        <li>
          <img
            width="200px"
            height="200px"
            id="photoshop"
            src="https://images.pexels.com/photos/17905523/pexels-photo-17905523.jpeg"
            alt="photoshop"
            srcset=""
          />
        </li>
        <li>
          <img
            width="200px"
            height="200px"
            id="japan"
            src="https://images.pexels.com/photos/17905514/pexels-photo-17905514.jpeg"
            alt=""
            srcset=""
          />
        </li>
        <li>
          <img
            width="200px"
            height="200px"
            id="river"
            src="https://images.pexels.com/photos/17585192/pexels-photo-17585192.jpeg"
            alt=""
            srcset=""
          />
        </li>
        <li>
          <img
            width="200px"
            height="200px"
            id="owl"
            src="https://images.pexels.com/photos/17585161/pexels-photo-17585161.jpeg"
            alt=""
            srcset=""
          />
        </li>
        <li>
          <img
            width="200px"
            height="200px"
            id="prayer"
            src="https://images.pexels.com/photos/17905503/pexels-photo-17905503.jpeg"
            alt=""
            srcset=""
          />
        </li>
        <li>
          <a style="color: aliceblue" id="google" href="http://www.google.com"
            >Google</a
          >
        </li>
      </ul>
    </div>
  </body>
  <script>
    // document.getElementById('owl').onclick = function(){
    //     alert("image got clicked")
    // }

    // attachEvent()
    // jQuery - on
    // type, timestamp, dafaultPrevented
    // target, toElement, srcElement, currentTarget
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    //EVENT PROPAGATION

    document.getElementById("images").addEventListener(
      "click",
      function (event) {
        console.log("clicked inside the ul");
      },
      false,
    );

    // document.getElementById("owl").addEventListener(
    //   "click",
    //   function (event) {
    //     console.log("owl clicked");
    //   },
    //   false,
    // );

    // document.getElementById("owl").addEventListener(
    //   "click",
    //   function (event) {
    //     console.log("owl clicked true");
    //   },
    //   true,
    // );

    document.getElementById("owl").addEventListener(
      "click",
      function (event) {
        console.log("owl clicked true");
        event.stopPropagation();
      },

      true,
    );

    // preventDefault
    document.getElementById("google").addEventListener(
      "click",
      function (event) {
        console.log("google clicked");

        event.preventDefault();
        event.stopPropagation();
      },
      false,
    );

    // document.querySelector("#images").addEventListener(
    //   "click",
    //   function (event) {
    //     console.log(event.target);
    //     console.log(event.target.parentNode);
    //     let removeIt = event.target.parentNode;

    //     // removeIt.parentNode.removeChild(removeIt)

    //     removeIt.remove();
    //   },
    //   false,
    // );

    document.querySelector("#images").addEventListener(
      "click",
      function (event) {
        console.log(event.target);
        console.log(event.target.tagName);

        if (event.target.tagName === "IMG") {
          let removeIt = event.target.parentNode;
          removeIt.remove();
        }
      },
      false,
    );
  </script>
</html>
